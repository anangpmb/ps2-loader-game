name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  changes:
    name: Detect changes
    # Only meaningful on branch pushes; tags & manual runs skip straight to build.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      # paths-filter diffs with git on push events, so the repo must be checked out first.
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build:
              - 'src/**'
              - 'src-tauri/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/build.yml'

  build-macos:
    name: macOS
    needs: changes
    # Build for tags (release) & manual runs always; on main only when build inputs changed.
    if: >-
      !cancelled()
      && (startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.build == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional

      - name: Build ARM64
        run: npx tauri build --target aarch64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Build Intel
        run: npx tauri build --target x86_64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Upload macOS ARM DMG
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Backup-Tool-macOS-ARM.dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Backup-Tool-macOS-Intel.dmg
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    name: Windows
    needs: changes
    if: >-
      !cancelled()
      && (startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.build == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: |
          Remove-Item -Recurse -Force node_modules, package-lock.json -ErrorAction SilentlyContinue
          npm install --include=optional

      - name: Build
        run: npx tauri build

      - name: Find MSI
        id: find-msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT }

      - name: Find EXE
        id: find-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path src-tauri/target/release/*.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'build|incremental' } | Select-Object -First 1
          }
          if ($exe) { echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT }

      - name: Upload Windows MSI
        if: steps.find-msi.outputs.msi_path
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Backup-Tool-Windows.msi
          path: ${{ steps.find-msi.outputs.msi_path }}

      - name: Upload Windows EXE
        if: steps.find-exe.outputs.exe_path
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Backup-Tool-Windows.exe
          path: ${{ steps.find-exe.outputs.exe_path }}

  release:
    name: Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: find artifacts -type f || true

      - name: Collect release files
        id: files
        run: |
          FILES=""
          for f in artifacts/*.dmg artifacts/*.msi artifacts/*.exe; do
            [ -f "$f" ] && FILES="$FILES"$'\n'"$f"
          done
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found files:"
          echo "$FILES"

      - name: Upload to Release
        if: steps.files.outputs.files != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.files.outputs.files }}
          body: |
            ## PS2 Backup Tool ${{ github.ref_name }}

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `PS2-Backup-Tool-macOS-ARM.dmg` |
            | macOS (Intel) | `PS2-Backup-Tool-macOS-Intel.dmg` |
            | Windows (Installer) | `PS2-Backup-Tool-Windows.msi` |
            | Windows (Portable) | `PS2-Backup-Tool-Windows.exe` |
            | Web | [GitHub Pages](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) |

            > macOS: right-click → Open on first launch
            > Windows: "More info" → "Run anyway"
