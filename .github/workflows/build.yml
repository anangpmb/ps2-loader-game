name: Build Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS (ARM + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend deps
        run: npm install

      - name: Build ARM64
        run: npx tauri build --target aarch64-apple-darwin
        env:
          # No code signing — skip Apple Developer
          APPLE_SIGNING_IDENTITY: ""

      - name: Build Intel
        run: npx tauri build --target x86_64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: ""

      - name: Rename artifacts
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle
          mv dmg/*.dmg "../../../../../PS2-Backup-Tool-macOS-ARM.dmg" 2>/dev/null || true
          cd ../../../..

          cd src-tauri/target/x86_64-apple-darwin/release/bundle
          mv dmg/*.dmg "../../../../../PS2-Backup-Tool-macOS-Intel.dmg" 2>/dev/null || true
          cd ../../../..

      - name: Upload macOS ARM
        uses: actions/upload-artifact@v4
        with:
          name: macOS-ARM
          path: PS2-Backup-Tool-macOS-ARM.dmg

      - name: Upload macOS Intel
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Intel
          path: PS2-Backup-Tool-macOS-Intel.dmg

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Build
        run: npx tauri build

      - name: Rename artifacts
        shell: pwsh
        run: |
          $dmg = Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dmg) { Copy-Item $dmg.FullName "PS2-Backup-Tool-Windows.msi" }

          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName "PS2-Backup-Tool-Windows.exe" }

          $nsis = Get-ChildItem -Path src-tauri/target/release/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis -and -not (Test-Path "PS2-Backup-Tool-Windows.exe")) { Copy-Item $nsis.FullName "PS2-Backup-Tool-Windows.exe" }

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: Windows-MSI
          path: PS2-Backup-Tool-Windows.msi

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: PS2-Backup-Tool-Windows.exe

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
          body: |
            ## PS2 Backup Tool ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `PS2-Backup-Tool-macOS-ARM.dmg` |
            | macOS (Intel) | `PS2-Backup-Tool-macOS-Intel.dmg` |
            | Windows (Installer) | `PS2-Backup-Tool-Windows.msi` |
            | Windows (Portable) | `PS2-Backup-Tool-Windows.exe` |

            ### Notes
            - **macOS**: Unsigned app — right-click > Open on first launch
            - **Windows**: Unsigned app — click "More info" > "Run anyway" on SmartScreen warning
          draft: false
          prerelease: false
